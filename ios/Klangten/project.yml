name: Klangten
options:
  bundleIdPrefix: it.sixdots
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
targets:
  Klangten:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/eltencore
        type: folder
        buildPhase: resources
      - path: Resources/stdlib
        type: folder
        buildPhase: resources
      - path: Resources/gemlibs
        type: folder
        buildPhase: resources
      - path: Resources/ios_boot.rb
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Klangten
        # Ohne diese beiden Zeilen schreibt xcodegen seine Vorgaben 1.0 und 1 in
        # die Info.plist, statt die Fassung aus MARKETING_VERSION zu uebernehmen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Der Datenordner der App erscheint dadurch in der Dateien-App unter
        # "Auf meinem iPhone"; der Dateimanager arbeitet genau darin.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Klangten uses the microphone for voice messages and conferences.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.sixdots.klangten
        DEVELOPMENT_TEAM: XJ3N4HV6L6
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_DEBUG_DYLIB: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Elten-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(inherited), $(SRCROOT)/vendor/cruby/include]
        LIBRARY_SEARCH_PATHS: [$(inherited), $(SRCROOT)/vendor/fiddle/$(PLATFORM_NAME)-$(CURRENT_ARCH), $(SRCROOT)/vendor/gems/$(PLATFORM_NAME)-$(CURRENT_ARCH), $(SRCROOT)/vendor/codecs/$(PLATFORM_NAME)-$(CURRENT_ARCH), $(SRCROOT)/vendor/teamconference/$(PLATFORM_NAME)-$(CURRENT_ARCH)]
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
          - -lresolv
          - -lc++
          - -lxml2
          - -lxslt
          - -lexslt
          - -lfiddle
          - -lffi
          - -lbigdecimal
          - -lzstdruby
          - -lnokogiri
          - -Wl,-force_load,$(SRCROOT)/vendor/codecs/$(PLATFORM_NAME)-$(CURRENT_ARCH)/libopus.a
          - -Wl,-force_load,$(SRCROOT)/vendor/codecs/$(PLATFORM_NAME)-$(CURRENT_ARCH)/libogg.a
          - -Wl,-force_load,$(SRCROOT)/vendor/codecs/$(PLATFORM_NAME)-$(CURRENT_ARCH)/libvorbis.a
          - -Wl,-force_load,$(SRCROOT)/vendor/codecs/$(PLATFORM_NAME)-$(CURRENT_ARCH)/libspeexdsp.a
          - -lteamconference_core
          - -Wl,-u,_tc_audio_format
          - -Wl,-u,_tc_clear_audio
          - -Wl,-u,_tc_connect
          - -Wl,-u,_tc_core_version
          - -Wl,-u,_tc_create
          - -Wl,-u,_tc_current_room
          - -Wl,-u,_tc_destroy
          - -Wl,-u,_tc_disconnect
          - -Wl,-u,_tc_download_file
          - -Wl,-u,_tc_get_deafen
          - -Wl,-u,_tc_get_mute
          - -Wl,-u,_tc_is_authenticated
          - -Wl,-u,_tc_is_connected
          - -Wl,-u,_tc_join_group_room
          - -Wl,-u,_tc_join_room
          - -Wl,-u,_tc_last_error
          - -Wl,-u,_tc_leave_room
          - -Wl,-u,_tc_list_input_devices
          - -Wl,-u,_tc_poll_event
          - -Wl,-u,_tc_read_audio
          - -Wl,-u,_tc_send
          - -Wl,-u,_tc_set_deafen
          - -Wl,-u,_tc_set_input_device
          - -Wl,-u,_tc_set_mute
          - -Wl,-u,_tc_set_user_volume
          - -Wl,-u,_tc_set_volume
          - -Wl,-u,_tc_stream_file
          - -Wl,-u,_tc_stream_is_active
          - -Wl,-u,_tc_stream_is_paused
          - -Wl,-u,_tc_stream_pause
          - -Wl,-u,_tc_stream_seek
          - -Wl,-u,_tc_stream_set_volume
          - -Wl,-u,_tc_stream_stop
          - -Wl,-u,_tc_upload_file
          - -Wl,-u,_tc_user_id
          - -Wl,-u,_tc_version
          # Export the app's own symbols into the dynamic table so the embedded
          # Ruby can resolve the host bridge (elten_host_*) via dlopen(nil)/dlsym.
          # Without this the @_cdecl entry points are not visible and the app is
          # silent + unresponsive to gestures.
          - -Wl,-export_dynamic
    dependencies:
      - framework: vendor/cruby/CRuby.xcframework
        embed: false
      - framework: Frameworks/bass.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassenc_mp3.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassenc.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassflac.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/basshls.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassmidi.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassmix.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/bassopus.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/basswebm.xcframework
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: UIKit.framework
