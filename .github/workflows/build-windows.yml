# Klangten: Windows release build.
#
# Produces dist\windows\KlangtenSetup.exe (x64 + x86; the ARM64 launcher needs an
# ARM64 host and is left out, the facade falls back to x64 under emulation).
# On a tag the installer, its SHA-256 and the build id are attached to the
# release, which is what the rolling update channel reads.

name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build id to embed (default: derived from the run number)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    # Windows Server 2025 with Visual Studio 2026 - the generator the presets ask for.
    runs-on: windows-2025-vs2026
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Build id bestimmen
        id: ident
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $input = "${{ inputs.build_id }}"
          if ($input) {
            $buildId = $input
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $buildId = $tag -replace '^v', ''
          } else {
            $buildId = "ci." + "${{ github.run_number }}"
          }
          # Erlaubt sind A-Z a-z 0-9 . _ + - (siehe docs/klangten-releases.md)
          $buildId = $buildId -replace '[^A-Za-z0-9._+-]', '-'
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          Write-Host "Build id: $buildId"

      # Ruby-Laufzeit und Gems werden vom Build selbst heruntergeladen und
      # kompiliert. Das dauert beim ersten Mal sehr lange, deshalb der Cache.
      - name: Ruby-Laufzeit aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            build/launcher-windows-x64/ruby
            build/launcher-windows-x86/ruby
          key: winruby-${{ runner.os }}-${{ hashFiles('cmake/EltenRubyRuntime.cmake', 'cmake/prepare_ruby_runtime.cmake', 'Gemfile') }}
          restore-keys: winruby-${{ runner.os }}-

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Spotify: ext/klangten_spotify wird hier aus dem Quelltext gebaut und
      # landet in bin\windows-x64 und bin\windows-x86 (nicht eingecheckt, siehe
      # .gitignore); der Paketbau kopiert bin\<arch> ins Programm.
      - name: Rust fuer die Spotify-Bibliothek
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
          rustc --version

      - name: Spotify-Bau aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ext/klangten_spotify/target
          key: spotify-win-${{ hashFiles('ext/klangten_spotify/Cargo.lock') }}
          restore-keys: spotify-win-

      - name: Spotify-Bibliothek bauen
        shell: cmd
        run: call tools\build-spotify.bat all

      # Klangmaschine: ext/klangten_audio (miniaudio, FFmpeg LGPL, LAME) mit
      # llvm-mingw in MSYS2 (auf dem Runner vorhanden), nach bin\windows-x64
      # und bin\windows-x86 (nicht eingecheckt). FFmpeg und LAME aus dem Cache.
      - name: Klangmaschine aus dem Cache
        uses: actions/cache@v4
        with:
          path: ext/klangten_audio/deps
          key: klangtenaudio-win-${{ hashFiles('tools/build-klangten-audio-windows.sh') }}

      - name: Klangmaschine bauen
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP"
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make nasm diffutils pkgconf tar xz"
          $llvm = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter "llvm-mingw-*").FullName -replace '\\','/' -replace '^([A-Za-z]):','/$1'
          $repo = "$env:GITHUB_WORKSPACE" -replace '\\','/' -replace '^([A-Za-z]):','/$1'
          C:\msys64\usr\bin\bash.exe -lc "cd '$repo' && LLVM_MINGW='$llvm' sh tools/build-klangten-audio-windows.sh x64 x86"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Launcher und Installer bauen
        shell: cmd
        run: |
          call "%CD%\tools\find-cmake-2026.bat" || exit /b 1
          echo Verwende CMake: %CMAKE_EXE%

          "%CMAKE_EXE%" --preset windows-x64 -DELTEN_BUILD_ID="${{ steps.ident.outputs.build_id }}" || exit /b 1
          "%CMAKE_EXE%" --preset windows-x86 -DELTEN_BUILD_ID="${{ steps.ident.outputs.build_id }}" || exit /b 1

          "%CMAKE_EXE%" --build --preset windows-x64-release --target EltenLauncher || exit /b 1
          "%CMAKE_EXE%" --build --preset windows-x86-release --target EltenLauncher || exit /b 1
          rem klangten.exe ist die Fassade aus dem x86-Build
          "%CMAKE_EXE%" --build --preset windows-x86-release --target EltenLauncherFacade || exit /b 1
          "%CMAKE_EXE%" --build --preset windows-x64-release --target EltenPkg || exit /b 1

      - name: Prüfsummen und Build id schreiben
        shell: pwsh
        run: |
          $installer = "dist/windows/KlangtenSetup.exe"
          if (-not (Test-Path $installer)) { throw "Installer wurde nicht erzeugt: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          # Format von sha256sum/shasum, das der Client erwartet
          "$hash  KlangtenSetup.exe" | Out-File -FilePath "dist/windows/KlangtenSetup.exe.sha256" -Encoding ascii -NoNewline
          "${{ steps.ident.outputs.build_id }}" | Out-File -FilePath "dist/windows/build-id.txt" -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"
          Write-Host ("Größe:   {0:N0} Bytes" -f (Get-Item $installer).Length)

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Klangten-Windows-${{ steps.ident.outputs.build_id }}
          path: |
            dist/windows/KlangtenSetup.exe
            dist/windows/KlangtenSetup.exe.sha256
            dist/windows/build-id.txt
          if-no-files-found: error

      # Der Text des Releases ist der Changelog-Eintrag dieser Version, denselben
      # zeigt der Client unter "Changelog" an.
      - name: Release-Text vorbereiten
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          $kandidaten = @(($v -replace '\.', '_'), (($v -replace '\.[^.]+$', '') -replace '\.', '_'))
          $quelle = $kandidaten | ForEach-Object { "locale/en-GB/changelog/$_.md" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($quelle) {
            Copy-Item $quelle release-notes.md
            Write-Host "Release-Text aus $quelle"
          } else {
            "Klangten $v" | Out-File release-notes.md -Encoding utf8
            Write-Host "::warning::Kein Changelog-Eintrag für $v gefunden"
          }

      - name: An das Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/windows/KlangtenSetup.exe
            dist/windows/KlangtenSetup.exe.sha256
            dist/windows/build-id.txt
          fail_on_unmatched_files: true
